<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${product.id != null} ? 'Edit Produk' : 'Tambah Produk'">Form Produk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4" style="max-width: 500px;">
        <h1 th:text="${product.id != null} ? 'Edit Produk' : 'Tambah Produk'">Form Produk</h1>

        <form th:action="@{/products/save}" th:object="${product}" method="post">

            <input type="hidden" th:field="*{id}">

            <!-- Nama Produk -->
            <div class="mb-3">
                <label for="name" class="form-label">Nama Produk</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required
                    placeholder="Masukkan nama produk">
            </div>

            <!-- Kategori -->
            <div class="mb-3">
                <label for="category" class="form-label">Kategori</label>
                <select id="category" th:field="*{category}" class="form-select" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Kategori</option>
                </select>
            </div>

            <!-- Harga -->
            <div class="mb-3">
                <label for="price" class="form-label">Harga (Rp)</label>
                <input type="number" id="price" th:field="*{price}" class="form-control" required min="0" step="100"
                    placeholder="0">
            </div>

            <!-- Stok -->
            <div class="mb-3">
                <label for="stock" class="form-label">Stok</label>
                <input type="number" id="stock" th:field="*{stock}" class="form-control" required min="0"
                    placeholder="0">
            </div>

            <!-- Deskripsi -->
            <div class="mb-3">
                <label for="description" class="form-label">Deskripsi</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                    placeholder="Deskripsi produk (opsional)"></textarea>
            </div>

            <!-- Aktif -->
            <div class="mb-4 form-check">
                <input type="checkbox" id="active" th:field="*{active}" class="form-check-input">
                <label for="active" class="form-check-label">Produk Aktif</label>
            </div>

            <!-- Tombol -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"
                    th:text="${product.id != null} ? 'Update' : 'Simpan'">Simpan</button>
                <a th:href="@{/products}" class="btn btn-secondary">Batal</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
